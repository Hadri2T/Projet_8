[pytest]
# Racine du projet dans le chemin Python, pour pouvoir faire "from src.api import app" dans les tests
pythonpath = .
testpaths = tests
filterwarnings =
    # Avertissement connu de HomeCreditImputer (idxmax sur une ligne sans type de revenu ni statut familial),
    # sans effet avec pandas 2.2.3 (version figée)
    ignore:The behavior of DataFrame.idxmax:FutureWarning
